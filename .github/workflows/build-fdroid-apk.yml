name: Build F-Droid apk

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    paths:
      - 'subscriptions/subscriptions-api/**'
      - 'subscriptions/subscriptions-dummy-impl/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_fdroid_apk:
    name: Build F-Droid apk
    runs-on: ubuntu-latest
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK version
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/.java-version
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # The Develocity Artifact Cache below caches the Gradle User Home instead
          cache-disabled: true

      - name: Set up Develocity Artifact Cache
        uses: gradle/develocity-artifact-cache-github-action@v1
        with:
          develocity-edge-url: https://usw2-edge.solutions-team.gradle.com
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          # Artifact Cache CLI before 1.11.0 leaves the repository out of generated image names; remove image-names once it is 1.11.0 or later
          image-names: |
            ${{ github.repository_id }}~${{ github.workflow }}~${{ github.job }}~${{ github.ref }}~${{ runner.os }}~${{ runner.arch }}
            ${{ github.repository_id }}~${{ github.workflow }}~${{ github.job }}~refs/heads/${{ github.base_ref || github.event.repository.default_branch }}~${{ runner.os }}~${{ runner.arch }}

      - name: Assemble F-Droid release apk
        env:
          MALICIOUS_SITE_PROTECTION_AUTH_TOKEN: ${{ secrets.MALICIOUS_SITE_PROTECTION_AUTH_TOKEN }}
        run: ./gradlew assembleFdroidRelease

      - name: Create Asana task when workflow failed on push to develop
        if: ${{ failure() && github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
        uses: honeycombio/gha-create-asana-task@main
        with:
          asana-secret: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-workspace-id: ${{ secrets.GH_ASANA_WORKSPACE_ID }}
          asana-project-id: ${{ secrets.GH_ASANA_AOR_PROJECT_ID }}
          asana-section-id: ${{ secrets.GH_ASANA_INCOMING_ID }}
          asana-task-name: GH Workflow Failure - Build F-Droid apk
          asana-task-description: The build F-Droid apk workflow has failed. See https://github.com/duckduckgo/Android/actions/runs/${{ github.run_id }}
