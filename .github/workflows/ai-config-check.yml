name: AI Config Check

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ai_config_check:
    name: AI Config Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK version
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/.java-version
          distribution: 'temurin'

      - name: Mint Develocity credential
        id: develocity-credential
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://duckduckgo.develocity.cloud')
            core.setSecret(token)
            core.setOutput('access-key', `duckduckgo.develocity.cloud=${token}`)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ steps.develocity-credential.outputs.access-key }}
          develocity-token-expiry: 6
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Validate AI config
        run: ./gradlew aiConfigCheck

      - name: Run AiConfigChecker unit tests
        run: ./gradlew :buildSrc:test --tests "com.duckduckgo.gradle.AiConfigCheckerTest"
