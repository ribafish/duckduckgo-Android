name: Build debug apk

on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug_apk:
    name: Build debug apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create folder
        run: mkdir apk

      - name: Decode debug keys
        uses: davidSchuppa/base64Secret-toFile-action@v2
        with:
          secret: ${{ secrets.DEBUG_PROPERTIES }}
          fileName: ddg_android_debug_build.properties
          destination-path: $HOME/jenkins_static/com.duckduckgo.mobile.android/

      - name: Decode debug key file
        uses: davidSchuppa/base64Secret-toFile-action@v2
        with:
          secret: ${{ secrets.DEBUG_KEY }}
          fileName: android
          destination-path: $HOME/jenkins_static/com.duckduckgo.mobile.android/

      - name: Set up JDK version
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/.java-version
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18.3'

      - name: Mint Develocity credential
        id: develocity-credential
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://duckduckgo.develocity.cloud')
            core.setSecret(token)
            core.setOutput('access-key', `duckduckgo.develocity.cloud=${token}`)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ steps.develocity-credential.outputs.access-key }}
          develocity-token-expiry: 6
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Capture runner info for build scans
        uses: ./.github/actions/develocity-runner-info

      - name: Assemble the project
        env:
          MALICIOUS_SITE_PROTECTION_AUTH_TOKEN: ${{ secrets.MALICIOUS_SITE_PROTECTION_AUTH_TOKEN }}
          DUCKSANS_PACKAGE_AUTH_USER: ${{ secrets.DAXMOBILE_GITHUB_PACKAGES_AUTOMATION_USER }}
          DUCKSANS_PACKAGE_AUTH_TOKEN: ${{ secrets.DAXMOBILE_GITHUB_PACKAGES_AUTOMATION }}
        run: ./gradlew assembleInternalDebug -Pforce-default-variant

      - name: Obtain debug apk
        if: always()
        run: cp "$(find . -regex '.*outputs/apk/.*internal-debug.apk')" pr-ddg-debug.apk

      - name: Upload debug apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ddg-debug
          path: pr-ddg-debug.apk

      - name: Cleanup secrets
        if: always()
        run: rm -rf "$HOME/jenkins_static/com.duckduckgo.mobile.android/"*.properties "$HOME/jenkins_static/com.duckduckgo.mobile.android/android"
